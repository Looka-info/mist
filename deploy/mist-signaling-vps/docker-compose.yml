services:
  mist-signaling:
    build: .
    container_name: mist-signaling
    restart: always
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    # Optional resource limits for small 1GB VPS:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
