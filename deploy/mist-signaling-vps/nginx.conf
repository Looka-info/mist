# Nginx reverse proxy configuration for Mist Signaling (WebSocket WSS)
# Configured for: signaling.akat-suki.site

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name signaling.akat-suki.site;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name signaling.akat-suki.site;

    # SSL certificates (managed by Certbot):
    # ssl_certificate /etc/letsencrypt/live/signaling.akat-suki.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/signaling.akat-suki.site/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
