[workspace]
resolver = "2"
members = [
    "apps/mist-desktop",
    "crates/mist-core",
    "crates/mist-domain",
    "crates/mist-config",
    "crates/mist-pairing",
    "crates/mist-ipc",
    "crates/mist-telemetry",
    "crates/mist-platform-windows",
    "crates/mist-session",
    "crates/mist-input",
    "crates/mist-bitstream",
    "crates/mist-qos",
    "services/signaling",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Mist Systems"]
license = "Proprietary"
repository = "https://github.com/Looka-info/mist"

[workspace.dependencies]
slint = "1.18.1"
slint-build = "1.18.1"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
