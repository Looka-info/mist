[package]
name = "mist-signaling"
version = "0.2.0"
edition = "2021"
description = "High-performance native WebRTC signaling service for Mist"

[lib]
name = "mist_signaling"
path = "src/lib.rs"

[[bin]]
name = "mist-signaling"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
