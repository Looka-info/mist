<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mist — Web Guest Client (WebCodecs & WebRTC)</title>
    <style>
        :root {
            --pixel-mint: #B8EBD5;
            --fresh-mint: #8ED8BA;
            --forest-green: #174B38;
            --deep-evergreen: #0D3024;
            --dark-background: #101A15;
            --dark-surface: #18231C;
            --dark-surface-variant: #212E26;
            --dark-outline: #2D3D34;
            --text-primary: #F2F8F4;
            --text-secondary: #90A398;
            --accent-error: #FFB4AB;
            --accent-warning: #FFD56B;
            --font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-background);
            color: var(--text-primary);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        header {
            height: 56px;
            background-color: var(--dark-surface);
            border-bottom: 1px solid var(--dark-outline);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--pixel-mint), var(--forest-green));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--deep-evergreen);
            font-size: 16px;
        }

        .logo-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            background: var(--dark-surface-variant);
            color: var(--text-secondary);
            border: 1px solid var(--dark-outline);
        }

        .badge-status.connected {
            background: rgba(142, 216, 186, 0.15);
            color: var(--pixel-mint);
            border-color: var(--pixel-mint);
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background-color: var(--dark-surface-variant);
            color: var(--text-primary);
            border: 1px solid var(--dark-outline);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--dark-outline);
            border-color: var(--fresh-mint);
        }

        button.primary {
            background-color: var(--pixel-mint);
            color: var(--deep-evergreen);
            border-color: var(--pixel-mint);
            font-weight: 600;
        }

        button.primary:hover {
            background-color: var(--fresh-mint);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        main {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            overflow: hidden;
        }

        #viewport {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: default;
        }

        #viewport.pointer-locked {
            cursor: none;
        }

        #hud-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(24, 35, 28, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--dark-outline);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            color: var(--pixel-mint);
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            z-index: 5;
        }

        #connection-modal {
            position: absolute;
            background: var(--dark-surface);
            border: 1px solid var(--dark-outline);
            border-radius: 16px;
            padding: 24px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            z-index: 20;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input, select {
            background: var(--dark-surface-variant);
            border: 1px solid var(--dark-outline);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--pixel-mint);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-group">
            <div class="logo-badge">M</div>
            <span class="logo-title">Mist Web Guest</span>
            <span id="status-badge" class="badge-status">Disconnected</span>
        </div>
        <div class="controls-group">
            <button id="btn-mouse-lock" title="Click to lock relative mouse" disabled>Lock Mouse</button>
            <button id="btn-fullscreen" title="Toggle Fullscreen">Fullscreen</button>
            <button id="btn-disconnect" class="hidden">Disconnect</button>
            <button id="btn-connect" class="primary">Connect</button>
        </div>
    </header>

    <main>
        <canvas id="viewport" width="1920" height="1080"></canvas>

        <div id="hud-overlay" class="hidden">
            <div>FPS: <span id="hud-fps">0</span></div>
            <div>Latency: <span id="hud-latency">0.0</span> ms</div>
            <div>RTT: <span id="hud-rtt">0.0</span> ms</div>
            <div>Loss: <span id="hud-loss">0.0%</span></div>
            <div>Codec: <span id="hud-codec">None</span> (WebCodecs)</div>
        </div>

        <div id="connection-modal">
            <h3 style="font-weight: 600;">Connect to Host</h3>
            <div class="input-group">
                <label for="cfg-signaling">Signaling WebSocket URL</label>
                <input id="cfg-signaling" type="text" value="ws://127.0.0.1:8080" />
            </div>
            <div class="input-group">
                <label for="cfg-token">Authorization / Pairing Token</label>
                <input id="cfg-token" type="text" value="mist-dev-token" />
            </div>
            <div class="input-group">
                <label for="cfg-codec">Preferred Codec</label>
                <select id="cfg-codec">
                    <option value="av01.0.08M.10">AV1 Main (WebCodecs)</option>
                    <option value="hvc1.1.6.L93.B0">HEVC Main (WebCodecs)</option>
                    <option value="avc1.64002a" selected>H.264 High 4.2 (WebCodecs)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="cfg-fps">Target Frame Rate</label>
                <select id="cfg-fps">
                    <option value="60" selected>60 FPS</option>
                    <option value="120">120 FPS</option>
                    <option value="30">30 FPS</option>
                </select>
            </div>
            <button id="btn-modal-connect" class="primary" style="margin-top: 8px;">Start Session</button>
        </div>
    </main>

    <script src="js/mist-web-client.js"></script>
</body>
</html>
