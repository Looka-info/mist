name: Mist Windows Release CI Matrix

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # WINDOWS X64 NATIVE HOST & CLIENT (PRIMARY RELEASE GATE)
  # ===========================================================================
  windows-x64:
    name: Windows x64 (Native Host & Slint Desktop)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Rust Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Workspace Tests
        run: cargo test --workspace --verbose

      - name: Build Rust Binaries and Stage Signaling (Release)
        run: |
          cargo build --package mist-desktop --package mist-signaling --release
          if (!(Test-Path "bin")) { New-Item -ItemType Directory -Path "bin" -Force }
          $sigCandidates = @("target/release/mist-signaling.exe", "services/signaling/target/release/mist-signaling.exe") | Where-Object { Test-Path $_ }
          foreach ($sig in $sigCandidates) {
            Copy-Item $sig "bin/mist-signaling.exe" -Force
            Write-Host "Staged bin/mist-signaling.exe from $sig" -ForegroundColor Green
            break
          }

      - name: Configure CMake Media Engine (Release)
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DMIST_BUILD_TESTS=ON `
            -DMIST_TREAT_WARNINGS_AS_ERRORS=ON

      - name: Build C++ Media Engine
        run: cmake --build build --config Release --parallel

      - name: Start Windows Audio Service
        run: |
          Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue

      - name: Run CTest Regression Suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Host & Client Self-Tests
        run: |
          ./build/apps/host/Release/mist_host.exe --version
          ./build/apps/host/Release/mist_host.exe --self-test
          ./build/apps/client/Release/mist_client.exe --version
          ./build/apps/client/Release/mist_client.exe --self-test

      - name: Build Installer & Distribution Packages
        run: |
          powershell -ExecutionPolicy Bypass -File ./scripts/build-installer.ps1 -ZipOutput "dist/mist-v0.3.0-rc3-windows-x64.zip"

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mist-windows-x64-v0.3.0-rc3
          path: dist/*
          if-no-files-found: error
