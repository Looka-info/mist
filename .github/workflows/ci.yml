name: Mist Windows Release CI Matrix

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # 1. WINDOWS X64 NATIVE HOST & CLIENT (PRIMARY RELEASE GATE)
  # ===========================================================================
  windows-x64:
    name: Windows x64 (Native Host & Slint Desktop)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Rust Formatting
        run: cargo fmt --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Workspace Tests
        run: cargo test --workspace --verbose

      - name: Configure CMake Media Engine (Release)
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DMIST_BUILD_TESTS=ON `
            -DMIST_TREAT_WARNINGS_AS_ERRORS=ON

      - name: Build C++ Media Engine
        run: cmake --build build --config Release --parallel

      - name: Run CTest Regression Suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Host & Client Self-Tests
        run: |
          ./build/apps/host/Release/mist_host.exe --version
          ./build/apps/host/Release/mist_host.exe --self-test
          ./build/apps/client/Release/mist_client.exe --version
          ./build/apps/client/Release/mist_client.exe --self-test

      - name: Build Installer & Distribution Packages
        run: |
          powershell -ExecutionPolicy Bypass -File ./scripts/build-installer.ps1 -ZipOutput "dist/mist-v0.3.0-rc3-windows-x64.zip"

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mist-windows-x64-v0.3.0-rc3
          path: dist/*
          if-no-files-found: error

  # ===========================================================================
  # 2. [EXPERIMENTAL] MACOS APPLE SILICON & INTEL (VIDEOTOOLBOX)
  # ===========================================================================
  macos:
    name: "[Experimental] macOS (Apple VideoToolbox Native SDK)"
    runs-on: macos-14
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Run Rust Workspace Tests (Host/Signaling/Crypto)
        run: cargo test --workspace --exclude mist-platform-windows --exclude mist-desktop --verbose

      - name: Configure and Build macOS Native Decoder
        run: |
          cmake -B build-mac -S . -DCMAKE_BUILD_TYPE=Release -DMIST_BUILD_TESTS=OFF
          cmake --build build-mac --target mist_decode --parallel

      - name: Verify VideoToolbox & CoreMedia Framework Linkage
        run: |
          clang++ -std=c++20 -O3 -Wall -Wextra -Werror \
            -framework VideoToolbox -framework CoreMedia -framework CoreVideo -framework Foundation \
            -Iengine/decode/include -Iengine/common/include -Iengine/encode/include -Iengine/input/include -Iengine/render/include \
            -c engine/decode/src/CrossPlatformDecoders.cpp -o cross_decoders_mac.o
          echo "macOS Apple VideoToolbox compilation verified successfully."

  # ===========================================================================
  # 3. [EXPERIMENTAL] LINUX X64 (VA-API & DMA-BUF)
  # ===========================================================================
  linux-x64:
    name: "[Experimental] Linux x64 (VA-API / DMA-BUF)"
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux VA-API and Display Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libdrm-dev libx11-dev libasound2-dev libpulse-dev ninja-build pkg-config

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Workspace Tests (Linux Target)
        run: cargo test --workspace --exclude mist-platform-windows --exclude mist-desktop --verbose

      - name: Configure and Build Linux VA-API Decoder
        run: |
          cmake -B build-linux -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DMIST_BUILD_TESTS=OFF
          cmake --build build-linux --target mist_decode

      - name: Verify Linux VA-API Decoder Direct Compilation
        run: |
          g++ -std=c++20 -O3 -Wall -Wextra -Werror \
            -Iengine/decode/include -Iengine/common/include -Iengine/encode/include -Iengine/input/include -Iengine/render/include \
            -c engine/decode/src/CrossPlatformDecoders.cpp -o cross_decoders_linux.o
          echo "Linux VA-API compilation verified successfully."

  # ===========================================================================
  # 4. [EXPERIMENTAL] ANDROID (NDK AMEDIACODEC)
  # ===========================================================================
  android-ndk:
    name: "[Experimental] Android NDK (AMediaCodec Hardware Target)"
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android NDK (r26b)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set up Rust Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure and Build Android NDK Decoder Target
        run: |
          cmake -B build-android -S . \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DMIST_BUILD_TESTS=OFF
          cmake --build build-android --target mist_decode

      - name: Verify Android NDK AMediaCodec Native Compilation
        run: |
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++ \
            -std=c++20 -O3 -Wall -Wextra -Werror \
            -Iengine/decode/include -Iengine/common/include -Iengine/encode/include -Iengine/input/include -Iengine/render/include \
            -c engine/decode/src/CrossPlatformDecoders.cpp -o cross_decoders_android.o
          echo "Android NDK AMediaCodec compilation verified successfully."

  # ===========================================================================
  # 5. [EXPERIMENTAL] WEB / WEBASSEMBLY (WEBCODECS & WEBRTC)
  # ===========================================================================
  web-wasm:
    name: "[Experimental] Web / WASM (WebCodecs & WebRTC Interop)"
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Web Client Files & Headless Browser Tests
        run: |
          node -c web/js/mist-web-client.js
          node -c web/test/run_browser_tests.js
          node -c web/test/webrtc_integration_test.js
          node web/test/run_browser_tests.js
          echo "WebCodecs JavaScript client syntax and unit tests verified."

      - name: Upload Web Client Distribution
        uses: actions/upload-artifact@v4
        with:
          name: mist-web-guest
          path: web/
