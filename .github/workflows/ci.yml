name: Mist Cross-Platform CI Matrix

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # 1. WINDOWS X64 NATIVE HOST & CLIENT
  # ===========================================================================
  windows-x64:
    name: Windows x64 (Native Host & Slint Desktop)
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Run Rust Workspace Tests
        run: cargo test --workspace --verbose

      - name: Configure CMake Media Engine (Release)
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DMIST_BUILD_TESTS=ON `
            -DMIST_TREAT_WARNINGS_AS_ERRORS=ON

      - name: Build C++ Media Engine
        run: cmake --build build --config Release --parallel

      - name: Run CTest Regression Suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Host & Client Self-Tests
        run: |
          ./build/apps/host/Release/mist_host.exe --version
          ./build/apps/host/Release/mist_host.exe --self-test
          ./build/apps/client/Release/mist_client.exe --version
          ./build/apps/client/Release/mist_client.exe --self-test

      - name: Stage Distribution Archive
        run: |
          powershell -ExecutionPolicy Bypass -File ./scripts/build-installer.ps1

      - name: Upload Windows x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mist-windows-x64
          path: dist/*
          if-no-files-found: ignore

  # ===========================================================================
  # 2. MACOS APPLE SILICON & INTEL (VIDEOTOOLBOX)
  # ===========================================================================
  macos:
    name: macOS (Apple VideoToolbox Native SDK)
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Run Rust Workspace Tests (Host/Signaling/Crypto)
        run: cargo test --workspace --exclude mist-platform-windows --verbose

      - name: Verify VideoToolbox & CoreMedia Framework Linkage
        run: |
          clang++ -std=c++20 -O3 -Wall -Werror \
            -framework VideoToolbox -framework CoreMedia -framework CoreVideo -framework Foundation \
            -Iengine/decode/include -Iengine/common/include -Iengine/encode/include -Iengine/input/include \
            -c engine/decode/src/CrossPlatformDecoders.cpp -o cross_decoders_mac.o
          echo "macOS Apple VideoToolbox compilation verified successfully."

  # ===========================================================================
  # 3. LINUX X64 (VA-API & DMA-BUF)
  # ===========================================================================
  linux-x64:
    name: Linux x64 (VA-API / DMA-BUF)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux VA-API and Display Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libva-dev libdrm-dev libx11-dev libasound2-dev libpulse-dev ninja-build

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Workspace Tests (Linux Target)
        run: cargo test --workspace --exclude mist-platform-windows --verbose

      - name: Verify Linux VA-API Decoder Compilation
        run: |
          g++ -std=c++20 -O3 -Wall -Werror \
            -Iengine/decode/include -Iengine/common/include -Iengine/encode/include -Iengine/input/include \
            -c engine/decode/src/CrossPlatformDecoders.cpp -o cross_decoders_linux.o
          echo "Linux VA-API compilation verified successfully."

  # ===========================================================================
  # 4. ANDROID (NDK AMEDIACODEC)
  # ===========================================================================
  android-ndk:
    name: Android NDK (AMediaCodec Hardware Target)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android NDK (r26b)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Set up Rust Android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Verify Android NDK AMediaCodec Native Compilation
        run: |
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++ \
            -std=c++20 -O3 -Wall -Werror \
            -Iengine/decode/include -Iengine/common/include -Iengine/encode/include -Iengine/input/include \
            -c engine/decode/src/CrossPlatformDecoders.cpp -o cross_decoders_android.o
          echo "Android NDK AMediaCodec compilation verified successfully."

  # ===========================================================================
  # 5. WEB / WEBASSEMBLY (WEBCODECS & WEBRTC)
  # ===========================================================================
  web-wasm:
    name: Web / WASM (WebCodecs Interop)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Web Client Files & Syntax
        run: |
          node -c web/js/mist-web-client.js
          node -c web/test/test_webcodecs.js
          echo "WebCodecs JavaScript client syntax verified."

      - name: Upload Web Client Distribution
        uses: actions/upload-artifact@v4
        with:
          name: mist-web-guest
          path: web/
