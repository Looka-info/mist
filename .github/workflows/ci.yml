name: Windows CI - Milestone 0

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Windows x64 (MSVC)
    runs-on: windows-2022

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable GitHub Actions cache for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Debug)
        run: |
          cmake -B build/Debug -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Debug `
            -DMIST_BUILD_TESTS=ON `
            -DMIST_TREAT_WARNINGS_AS_ERRORS=ON

      - name: Build Debug
        run: |
          cmake --build build/Debug --config Debug --parallel

      - name: Run Debug Tests
        run: |
          ctest --test-dir build/Debug -C Debug --output-on-failure --verbose

      - name: Configure CMake (Release)
        run: |
          cmake -B build/Release -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DMIST_BUILD_TESTS=ON `
            -DMIST_TREAT_WARNINGS_AS_ERRORS=ON

      - name: Build Release
        run: |
          cmake --build build/Release --config Release --parallel

      - name: Run Release Tests
        run: |
          ctest --test-dir build/Release -C Release --output-on-failure --verbose

      - name: Smoke Test - Host Startup & Version
        run: |
          ./build/Release/apps/host/Release/mist_host.exe --version
          ./build/Release/apps/host/Release/mist_host.exe --self-test

      - name: Smoke Test - Client Startup & Version
        run: |
          ./build/Release/apps/client/Release/mist_client.exe --version
          ./build/Release/apps/client/Release/mist_client.exe --self-test
